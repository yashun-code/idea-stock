<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>idea-stock</title>
</head>
<body>
  <div class="phone">
    <header>
      <h1>💡 idea-<span>stock</span></h1>
    </header>

    <main>
      <section class="screen active" id="write-screen" aria-labelledby="write-tab">
        <label class="sr-only" for="memo-input">アイデアメモ</label>
        <textarea id="memo-input" placeholder="思いついたことをそのまま書く…&#10;&#10;整理はAIがやるので、殴り書きでOK"></textarea>
        <div class="btn-row">
          <button class="mic-btn" id="mic-button" type="button" title="音声入力" aria-label="音声入力">🎤</button>
          <button class="save-btn" id="save-button" type="button">保存する</button>
        </div>
        <p class="hint">🎤で話した内容がそのまま入力欄に入ります／保存すると、AIが自動でタイトル・カテゴリ・タグを付けます</p>

        <p class="section-label">さっき保存したメモ</p>
        <div id="recent-memos" aria-live="polite"></div>
      </section>

      <section class="screen" id="list-screen" aria-labelledby="list-tab">
        <label class="sr-only" for="search-input">メモを検索</label>
        <input class="search" id="search-input" type="search" placeholder="🔍 メモを検索" autocomplete="off">
        <div class="chips" id="category-chips" aria-label="カテゴリで絞り込む"></div>
        <div id="memo-list" aria-live="polite"></div>
      </section>

      <section class="screen" id="settings-screen" aria-labelledby="settings-tab">
        <div class="setting-group">
          <h2>Claude APIキー</h2>
          <label class="sr-only" for="api-key-input">Claude APIキー</label>
          <input id="api-key-input" type="password" placeholder="sk-ant-api..." autocomplete="off" spellcheck="false">
          <button class="sub-btn test-btn" id="connection-test" type="button">接続テスト</button>
          <p id="connection-status" class="connection-status" role="status"></p>
          <p class="setting-note">キーはこのスマホの中（ブラウザ）にだけ保存されます。Claude API通信時のみAnthropicへ送信されます。</p>
        </div>
        <div class="setting-group">
          <h2>データ</h2>
          <button class="sub-btn" id="backup-button" type="button">メモをファイルに書き出す（バックアップ）</button>
          <p class="setting-note" id="memo-count">メモは全部このスマホの中に保存されています。現在 0件。</p>
        </div>
      </section>
    </main>

    <nav aria-label="メインナビゲーション">
      <button class="on" id="write-tab" data-screen="write" type="button"><span class="ico">✏️</span>書く</button>
      <button id="list-tab" data-screen="list" type="button"><span class="ico">📚</span>一覧</button>
      <button id="settings-tab" data-screen="settings" type="button"><span class="ico">⚙️</span>設定</button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status">📋 クリップボードにコピーしました</div>
  <script src="app.js"></script>
</body>
</html>
